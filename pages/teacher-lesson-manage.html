<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý bài giảng · AgriAcademy</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/modules.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="teacher-lesson-manage" data-role="teacher">

  <div class="app">
    <header class="topbar" id="topbar"></header>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính"></aside>
      <main class="main" id="main">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="teacher-dashboard.html">Tổng quan lớp</a><span class="sep">/</span>
          <span class="current">Quản lý bài giảng</span>
        </nav>

        <div class="page-head">
          <div>
            <h1>Quản lý bài giảng</h1>
            <p class="sub">Biên soạn nội dung, sắp xếp thứ tự và quyết định xuất bản bài giảng cho sinh viên.</p>
          </div>
          <div class="page-head__actions">
            <a class="btn btn--ghost" href="student-lesson-view.html">Xem như sinh viên</a>
            <button class="btn btn--primary" type="button" id="lesson-add">+ Thêm bài giảng</button>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-field">
            <span class="icon" aria-hidden="true">⌕</span>
            <label class="visually-hidden" for="lesson-search">Tìm bài giảng</label>
            <input class="input" id="lesson-search" type="search" placeholder="Tìm tiêu đề, chủ đề…">
          </div>
          <label class="visually-hidden" for="lesson-status">Trạng thái</label>
          <select class="select" id="lesson-status">
            <option value="">Tất cả trạng thái</option>
            <option value="published">Đã xuất bản</option>
            <option value="draft">Bản nháp</option>
          </select>
          <span class="result-count" id="lesson-count">Đang tải…</span>
        </div>

        <section class="card" aria-label="Danh sách bài giảng">
          <div id="lesson-manage-list" aria-live="polite">
            <div class="manage-row"><div class="skeleton skeleton--line w-60" style="flex:1"></div></div>
            <div class="manage-row"><div class="skeleton skeleton--line w-80" style="flex:1"></div></div>
            <div class="manage-row"><div class="skeleton skeleton--line w-60" style="flex:1"></div></div>
          </div>
        </section>

        <div class="callout callout--info mt-2">
          <span class="ico" aria-hidden="true">i</span>
          <span>Bài giảng ở trạng thái <strong>Bản nháp</strong> chỉ giảng viên và quản trị viên nhìn thấy. Sinh viên chỉ học bài <strong>Đã xuất bản</strong>.</span>
        </div>
      </main>
    </div>
    <footer class="foot" id="foot"></footer>
  </div>

  <script src="../js/data/seed.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/modules/manage.js"></script>
</body>
</html>
