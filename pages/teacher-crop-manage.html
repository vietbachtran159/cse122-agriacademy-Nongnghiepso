<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý cây trồng · AgriAcademy</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/modules.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="teacher-crop-manage" data-role="teacher">

  <div class="app">
    <header class="topbar" id="topbar"></header>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính"></aside>
      <main class="main" id="main">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="teacher-dashboard.html">Tổng quan lớp</a><span class="sep">/</span>
          <span class="current">Quản lý cây trồng</span>
        </nav>

        <div class="page-head">
          <div>
            <h1>Quản lý cây trồng</h1>
            <p class="sub">Cập nhật đặc điểm, vùng trồng và quy trình chăm sóc từng bước cho thư viện cây trồng.</p>
          </div>
          <div class="page-head__actions">
            <a class="btn btn--ghost" href="visitor-crop-library.html">Xem thư viện</a>
            <button class="btn btn--primary" type="button" id="crop-add">+ Thêm cây trồng</button>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-field">
            <span class="icon" aria-hidden="true">⌕</span>
            <label class="visually-hidden" for="crop-search">Tìm cây trồng</label>
            <input class="input" id="crop-search" type="search" placeholder="Tìm tên cây, vùng miền, mùa vụ…">
          </div>
          <span class="result-count" id="crop-count">Đang tải…</span>
        </div>

        <section class="card" aria-label="Danh sách cây trồng">
          <div id="crop-manage-list" aria-live="polite">
            <div class="manage-row"><div class="skeleton skeleton--line w-60" style="flex:1"></div></div>
            <div class="manage-row"><div class="skeleton skeleton--line w-80" style="flex:1"></div></div>
            <div class="manage-row"><div class="skeleton skeleton--line w-60" style="flex:1"></div></div>
          </div>
        </section>

        <div class="callout callout--warn mt-2">
          <span class="ico" aria-hidden="true">!</span>
          <span>Xóa cây trồng không xóa mùa vụ đã lập của sinh viên, nhưng lịch có thể thiếu tên cây. Nên kiểm tra trước khi xóa.</span>
        </div>
      </main>
    </div>
    <footer class="foot" id="foot"></footer>
  </div>

  <script src="../js/data/seed.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/modules/manage.js"></script>
</body>
</html>
