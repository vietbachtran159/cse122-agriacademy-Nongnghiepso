<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chấm bài · AgriAcademy</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/modules.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="teacher-grading" data-role="teacher">

  <div class="app">
    <header class="topbar" id="topbar"></header>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính"></aside>
      <main class="main" id="main">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="teacher-dashboard.html">Tổng quan lớp</a><span class="sep">/</span>
          <span class="current">Chấm bài</span>
        </nav>

        <div class="page-head">
          <div>
            <h1>Chấm bài nộp</h1>
            <p class="sub">Xem từng bước trả lời của sinh viên, cho điểm thang 10 và gửi nhận xét. Sinh viên nhận thông báo ngay sau khi chấm.</p>
          </div>
          <div class="page-head__actions">
            <a class="btn btn--ghost" href="teacher-exercise-build.html">Quản lý bài tập</a>
          </div>
        </div>

        <section class="card mb-2">
          <div class="kpi-row" id="grading-stats">
            <div class="kpi"><b>—</b><span>Tổng bài nộp</span></div>
          </div>
        </section>

        <div class="filter-bar">
          <label class="visually-hidden" for="grading-status">Trạng thái</label>
          <select class="select" id="grading-status">
            <option value="pending">Chờ chấm</option>
            <option value="graded">Đã chấm</option>
            <option value="">Tất cả</option>
          </select>
          <label class="visually-hidden" for="grading-exercise">Bài tập</label>
          <select class="select" id="grading-exercise"><option value="">Tất cả bài tập</option></select>
          <div class="search-field">
            <span class="icon" aria-hidden="true">⌕</span>
            <label class="visually-hidden" for="grading-search">Tìm sinh viên</label>
            <input class="input" id="grading-search" type="search" placeholder="Tìm sinh viên, mã SV…">
          </div>
          <span class="result-count" id="grading-count">Đang tải…</span>
        </div>

        <div class="grid" id="grading-list" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))" aria-live="polite">
          <div class="card"><div class="skeleton skeleton--line w-60"></div><div class="skeleton skeleton--line w-80"></div><div class="skeleton skeleton--block"></div></div>
          <div class="card"><div class="skeleton skeleton--line w-60"></div><div class="skeleton skeleton--line w-80"></div><div class="skeleton skeleton--block"></div></div>
        </div>
      </main>
    </div>
    <footer class="foot" id="foot"></footer>
  </div>

  <script src="../js/data/seed.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/modules/grading.js"></script>
</body>
</html>
